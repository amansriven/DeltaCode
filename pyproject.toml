[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-code"
version = "0.1.0"
description = "Evidence-first AI migrations for breaking API changes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cryptography",
  "fastapi",
  "httpx",
  "packaging",
  "procrastinate",
  "psycopg[binary]",
  "python-dotenv[cli]",
  "PyJWT",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
  "jsonschema[format]>=4.23,<5",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"]
